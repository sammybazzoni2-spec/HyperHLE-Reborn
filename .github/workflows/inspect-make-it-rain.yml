name: Inspect Make It Rain IPA

# Diagnostic only: downloads the IPA on the runner, prints its Info.plist, file
# listing and a few binary strings to the job log, and discards it. Nothing from
# the IPA is uploaded as an artifact.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-make-it-rain.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Download IPA
        run: ./dev-scripts/get-make-it-rain.sh "$RUNNER_TEMP/apps"

      - name: Unpack and inspect
        run: |
          set -eu
          WORK="$RUNNER_TEMP/ipa"
          mkdir -p "$WORK"
          unzip -q "$RUNNER_TEMP"/apps/*.ipa -d "$WORK"
          APP="$(ls -d "$WORK"/Payload/*.app)"
          echo "::group::Top-level files in the .app"
          ls -la "$APP"
          echo "::endgroup::"
          echo "::group::Nibs, storyboards and frameworks"
          find "$APP" -name '*.nib' -o -name '*.storyboard*' -o -name '*.framework' -o -name '*.dylib' | sort
          echo "::endgroup::"
          echo "::group::Info.plist"
          python3 - "$APP/Info.plist" <<'EOF'
          import plistlib, pprint, sys
          with open(sys.argv[1], 'rb') as f:
              pprint.pprint(plistlib.load(f))
          EOF
          echo "::endgroup::"
          BIN="$APP/$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")"
          echo "::group::Binary info"
          file "$BIN"
          ls -la "$BIN"
          echo "::endgroup::"
          echo "::group::Window and app delegate strings"
          strings -a "$BIN" | grep -E "UIWindow|makeKeyAndVisible|MainWindow|AppDelegate|applicationDidFinishLaunching|didFinishLaunchingWithOptions|UIApplicationMain|rootViewController|EAGLView|CAEAGLLayer|ViewController" | sort -u | head -120
          echo "::endgroup::"
          echo "::group::Third-party SDK strings"
          strings -a "$BIN" | grep -iE "adcolony|flurry|chartboost|facebook|tapjoy|openfeint|gamecenter|crashlytics|heyzap" | sort -u | head -60
          echo "::endgroup::"
